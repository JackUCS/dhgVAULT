<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — DHGateVault</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
    <div class="bg-orb bg-orb--3"></div>
    <div class="grid-overlay"></div>
    <div class="toast-container" id="toastContainer"></div>

    <div class="app-container admin-panel" id="adminPanel">
        <!-- Lock overlay -->
        <div id="adminLockOverlay" class="admin-lock">
            <div class="admin-lock__card">
                <h2><i class="bi bi-lock-fill"></i> Admin Locked</h2>
                <p>Enter the admin password to make changes.</p>
                <input type="password" id="adminUnlockPassword" placeholder="Password" class="form-group-input">
                <button id="btnUnlockAdmin" class="btn btn--primary">Unlock Admin</button>
                <p id="unlockError" style="color:var(--danger); margin-top:8px; display:none;">Incorrect password</p>
            </div>
        </div>

        <!-- Header -->
        <div class="admin-header">
            <h2><i class="bi bi-speedometer2"></i> Dashboard</h2>
            <button class="btn btn--ghost btn--sm" id="btnLogout"><i class="bi bi-box-arrow-right"></i> Logout</button>
        </div>

        <!-- Slim stats row -->
        <div class="admin-stats-row">
            <div class="admin-stat-slim">
                <i class="bi bi-box-seam stat-slim-icon"></i>
                <span class="stat-slim-value" id="adminTotalProducts">0</span>
                <span class="stat-slim-label">Products</span>
            </div>
            <div class="admin-stat-slim">
                <i class="bi bi-mouse2 stat-slim-icon"></i>
                <span class="stat-slim-value" id="adminTotalClicks">0</span>
                <span class="stat-slim-label">Clicks</span>
            </div>
            <div class="admin-stat-slim">
                <i class="bi bi-eye stat-slim-icon"></i>
                <span class="stat-slim-value" id="adminTotalViews">0</span>
                <span class="stat-slim-label">Views</span>
            </div>
            <div class="admin-stat-slim">
                <i class="bi bi-star stat-slim-icon"></i>
                <span class="stat-slim-value" id="adminTopProduct">—</span>
                <span class="stat-slim-label">Top Product</span>
            </div>
        </div>

        <!-- Add Product (compact collapsible) -->
        <div class="admin-card collapsible">
            <button class="collapsible__trigger">
                <i class="bi bi-plus-circle"></i> Add New Product
                <i class="bi bi-chevron-down collapsible__arrow"></i>
            </button>
            <div class="collapsible__content">
                <form id="addProductForm" class="admin-form compact-form">
                    <div class="form-row">
                        <div class="form-group"><label>DHGate Link</label><input type="url" id="inputDhgateLink" required disabled></div>
                        <div class="form-group"><label>Thumbnail URL</label><input type="url" id="inputThumbnailUrl" required disabled></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Title</label><input type="text" id="inputTitle" required disabled></div>
                        <div class="form-group"><label>Price (USD)</label><input type="text" id="inputPrice" required disabled></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Affiliate Link</label><input type="url" id="inputAffiliateLink" required disabled></div>
                        <div class="form-group"><label>Category</label>
                            <select id="inputCategory" disabled>
                                <option value="shirts">Shirts</option><option value="pants">Pants</option><option value="joggers">Joggers</option>
                                <option value="shoes">Shoes</option><option value="slides">Slides</option><option value="chains">Chains</option><option value="accessories">Accessories</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Rating</label><input type="number" id="inputRating" min="1" max="5" step="0.5" value="4.5" disabled></div>
                        <div class="form-group"><label>Review Photos</label><input type="file" id="inputReviewPhotos" accept="image/*" multiple disabled></div>
                    </div>
                    <div class="review-previews" id="reviewPreviews"></div>
                    <button type="submit" class="btn btn--primary btn--full" disabled>✨ Add Product</button>
                </form>
            </div>
        </div>

        <!-- Vault Credentials (compact) -->
        <div class="admin-card collapsible">
            <button class="collapsible__trigger">
                <i class="bi bi-lock-fill"></i> Vault Credentials
                <i class="bi bi-chevron-down collapsible__arrow"></i>
            </button>
            <div class="collapsible__content">
                <div class="form-row">
                    <div class="form-group"><label>Username</label><input type="text" id="vaultUsernameInput" placeholder="Set a username" disabled></div>
                    <div class="form-group"><label>Password</label><input type="password" id="vaultPasswordInput" placeholder="Set a password" disabled></div>
                </div>
                <button class="btn btn--primary btn--sm" id="btnSaveVaultCreds" disabled><i class="bi bi-save"></i> Save</button>
            </div>
        </div>

        <!-- Click Performance Chart -->
        <div class="admin-card">
            <h3><i class="bi bi-bar-chart-fill"></i> Click Performance</h3>
            <div class="bar-chart-wrapper">
                <div class="bar-chart" id="barChart"></div>
                <div class="bar-chart-tooltip" id="chartTooltip" style="display:none;"></div>
            </div>
        </div>

        <!-- Product Table -->
        <div class="admin-card">
            <h3><i class="bi bi-table"></i> Product Click Details</h3>
            <div class="admin-table-wrap">
                <table class="admin-table" id="adminTable">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Clicks</th>
                            <th>Last</th>
                            <th>Priority</th>
                            <th style="width:60px;"></th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody"></tbody>
                </table>
            </div>
        </div>

        <button class="btn btn--ghost btn--sm" id="btnResetAnalytics" disabled style="color:var(--danger); margin-top:16px;">
            <i class="bi bi-arrow-counterclockwise"></i> Reset Analytics
        </button>
    </div>

    <script src="admin.js"></script>
</body>
</html>
